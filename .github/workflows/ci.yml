name: ci

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6
                
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Verify the packed SDK as a consumer
        run: |
          pnpm build
          mkdir -p /tmp/alpha-sdk-package /tmp/alpha-sdk-consumer
          pnpm pack --pack-destination /tmp/alpha-sdk-package
          cd /tmp/alpha-sdk-consumer
          npm init --yes
          npm install /tmp/alpha-sdk-package/*.tgz
          node -e "const { AlphaClient } = require('@openantares/alpha'); new AlphaClient({ token: 'test' });"

  publish:
    needs: [ compile, test ]
    # Fern uses internal non-version tags while replaying generated changes.
    # Only release tags may reach npm.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required for checkout
      id-token: write  # Required for OIDC
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: |
          if [[ ${GITHUB_REF} == *alpha* ]]; then
            npm publish --access public --provenance --tag alpha
          elif [[ ${GITHUB_REF} == *beta* ]]; then
            npm publish --access public --provenance --tag beta
          else
            PKG_NAME=$(node -p "require('./package.json').name")
            PKG_VERSION=$(node -p "require('./package.json').version")
            CURRENT_LATEST=$(npm view "${PKG_NAME}" dist-tags.latest 2>/dev/null || echo "0.0.0")
            if npx -y semver@7.8.1 "${PKG_VERSION}" -r "<${CURRENT_LATEST}" > /dev/null 2>&1; then
              echo "Publishing ${PKG_VERSION} with --tag backport (current latest is ${CURRENT_LATEST})"
              npm publish --access public --provenance --tag backport
            else
              npm publish --access public --provenance
            fi
          fi
